<!doctype html>
<html lang="en">

        label: 'The Cabin',
        accent: '#7A8450',

        eyebrow: 'Utopia Nature Estate',
        title:   'Leave the tar road behind.',
        body:    'An off-grid cabin in the Buffelspoort bushveld, where the pace drops away the moment you arrive.',

      scene('bedroom', {

        accent: '#7A8450',
        scroll: 1.4, dwell: 0.35,
        eyebrow: 'Made for deep sleep',

      scene('boma', {

        accent: '#5E8B7E',
        scroll: 1.8, dwell: 0.5,
        eyebrow: 'Serenity, found',
