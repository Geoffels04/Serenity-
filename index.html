<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is required for the safe-area insets the engine uses -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pearl &amp; Co.</title>
<meta name="description" content="Scroll to fly through the world.">

<!-- Theme. These are unlayered, so they beat the engine's @layer defaults. -->
<style>
  :root, .tz {
    --tz-bg: #F5EDE0;
    --tz-ink: #241d2b;
    --tz-ink-soft: #6a6072;
    --tz-accent: #9B7EBD;
    /* --tz-font-display: "Your Display", ui-rounded, system-ui, sans-serif; */
    /* --tz-font-body:    "Your Body", system-ui, sans-serif; */
  }
  /* Dark theme: set these two and the copy scrim and title shadow follow.
     :root { --tz-bg:#12101a; --tz-ink:#f3eef8; --tz-ink-soft:#a89fb8; } */
  html, body { margin: 0; }
</style>
</head>
<body>

<div id="flight"></div>

<script src="flight-engine.js"></script>
<script>
  mountFlight(document.getElementById('flight'), {
    brand: { name: 'Pearl & Co.', href: '#' },
    cta:   { label: 'Find a store', href: '#finale' },
    hint:  'scroll to fly in',

    sceneScroll: 1.3,
    linkScroll:  0.9,
    crossfade:   0.12,

    scenes: [
      {
        id: 'farm', label: 'The Farms',
        poster: 'assets/farm.webp',
        clip:   'assets/vid/farm.mp4',
        accent: '#8FB98A',
        scroll: 1.5, dwell: 0.35,
        eyebrow: 'From leaf to last sip',
        title:   'It starts in the hills.',
        body:    'Every batch begins on a single-origin terrace, picked by hand at first light.',
        tags:    ['Single-origin', 'Hand-picked']
      },
      {
        id: 'kitchen', label: 'The Kitchen',
        poster: 'assets/kitchen.webp',
        clip:   'assets/vid/kitchen.mp4',
        accent: '#C88A5A',
        eyebrow: 'Made this morning',
        title:   'Pearls, rolled by hand.',
        body:    'Cooked in small batches through the day, never held overnight.',
        tags:    ['Small batch', 'Cooked daily']
      },
      {
        id: 'finale', label: 'The Cup',
        poster: 'assets/finale.webp',
        clip:   'assets/vid/finale.mp4',
        accent: '#9B7EBD',
        scroll: 1.8, dwell: 0.5,
        eyebrow: 'The payoff',
        title:   'Yours in six minutes.',
        body:    'Order ahead and it is waiting on the counter with your name on it.',
        cta: {
          primary:   { label: 'Order now',    href: '/order' },
          secondary: { label: 'Find a store', href: '/stores' }
        }
      }
    ],

    /* length = scenes.length - 1. A null entry means "crossfade this seam directly". */
    links: [
      'assets/vid/link1.mp4',
      'assets/vid/link2.mp4'
    ]
  });
</script>
</body>
</html>
